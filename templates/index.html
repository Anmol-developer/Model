<!DOCTYPE html>
<html>
  <head>
    <title>Solar PV Power Forecasting</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: white;
      }

      .header {
        background-color: blue;
        border-top: solid white 6pt;
        border-bottom: solid white 6pt;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 24px;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
      }

      .background-image {
        background-image: url("static/bg.jpeg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .login-box {
        background-color: white;
        border: solid lightgray 1px;
        border-radius: 4px;
        padding: 20px;
        max-width: 400px;
        margin-top: 100px;
      }

      .login-box input[type="text"],
      .login-box input[type="password"] {
        width: 90%;
        padding: 10px;
        margin-bottom: 10px;
        border: solid lightgray 1px;
        border-radius: 8px;
      }

      .login-box button {
        background-color: blue;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="background-image">
      <div class="header">
        <h1>PV POWER FORECASTING</h1>
      </div>
      <div class="login-box">
        <form action="/dashboard" method="POST">
          <input type="text" name="username" placeholder="Username" />
          <input type="password" name="password" placeholder="Password" />
          <button type="submit">Login</button>
        </form>
      </div>
    </div>
  </body>
</html>
